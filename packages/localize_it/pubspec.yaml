name: localize_it
description: A tool for making localizing your Flutter App easy peasy lemmon squeezy.
homepage: https://github.com/DieGlueckswurst/localize_it
repository: https://github.com/DieGlueckswurst/localize_it
issue_tracker: https://github.com/DieGlueckswurst/localize_it/issues
version: 2.0.0
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.9.0

dependencies:
  localize_it_annotation: ^3.0.0
  # Range aligned with source_gen / build; avoids `analyzer: any` pub warnings.
  analyzer: ">=8.1.1 <13.0.0"
  build: ^4.0.0
  source_gen: ^4.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.0
  flutter_lints: ^6.0.0

